name: Synthetic workflow tests
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Linux media tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr libegl1 libgl1 libopengl0 libxkbcommon0 libxcb-cursor0 libpulse0
      - name: Windows test media tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg install failed' }
          choco install tesseract -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Tesseract install failed' }
          "C:\Program Files\Tesseract-OCR" >> $env:GITHUB_PATH
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python -m pytest -q --junitxml=build-evidence/results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-tests-${{ runner.os }}
          path: build-evidence/
          if-no-files-found: warn

  evidence:
    if: always() && github.event_name == 'push'
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: synthetic-tests-*
          path: ${{ runner.temp }}/matrix-evidence
      - name: Collect bounded matrix test reports
        env:
          MATRIX_REPORTS: ${{ runner.temp }}/matrix-evidence
          EVIDENCE_PATH: ${{ runner.temp }}/matrix-summary
        run: |
          python - <<'PYTHON'
          import os,shutil
          from pathlib import Path
          source=Path(os.environ['MATRIX_REPORTS']);target=Path(os.environ['EVIDENCE_PATH']);target.mkdir(parents=True,exist_ok=True)
          for p in source.rglob('*.xml'):
              shutil.copyfile(p,target/(p.parent.name+'-'+p.name))
          PYTHON
      - name: Record test result without changing application branches
        env:
          EVIDENCE_BRANCH: ci/synthetic-evidence
          EVIDENCE_PATH: ${{ runner.temp }}/matrix-summary
          BUILD_RESULT: ${{ needs.tests.result }}
        run: python scripts/publish_portable_evidence.py
