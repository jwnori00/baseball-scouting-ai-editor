name: Retrieve Windows build failure
on:
  push:
    branches: [build/windows-timeline-portable]
    paths-ignore: ['build-results/**']
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45038757342
          name: Windows-build-evidence
          path: evidence
      - name: Save bounded synthetic failure details
        run: |
          mkdir -p build-results
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          lines = [str(f.relative_to("evidence")) + " " + str(f.stat().st_size) for f in Path("evidence").rglob("*") if f.is_file()]
          report = Path('evidence/windows-tests.xml')
          if report.exists():
              root = ET.parse(report)
              for case in root.iter('testcase'):
                  problem = case.find('failure')
                  if problem is None:
                      problem = case.find('error')
                  if problem is not None:
                      lines.append(case.get('classname', '') + '.' + case.get('name', ''))
                      lines.extend(line.strip() for line in (problem.text or '').splitlines() if line.startswith(('E ', 'tests', '>')))
          for name in ('portable-smoke.progress.json', 'portable-smoke.json'):
              result = Path('evidence', name)
              if result.exists():
                  lines.extend(result.read_text().splitlines())
          log = Path('evidence/portable-build.log')
          if log.exists():
              data = log.read_bytes()
              encoding = 'utf-16' if data.startswith((b'\xff\xfe', b'\xfe\xff')) else 'utf-8-sig'
              lines.extend(data.decode(encoding, errors='replace').splitlines()[-10:])
          lines = [re.sub(r'https?://\S+|(?i:token|password|secret)\s*=\s*\S+', '[redacted]', line)[:500] for line in lines]
          Path('build-results/failure.txt').write_text('\n'.join(lines[-50:]) or 'No matching failure detail in artifact.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-results/failure.txt
          git commit -m 'Record Windows build failure details'
          git push origin HEAD:refs/heads/build/windows-timeline-portable
