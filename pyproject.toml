[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "baseball-scouting-ai-editor"
dynamic = ["version"]
description = "Local, review-first baseball scouting analysis workbench"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy==2.2.6", "opencv-python-headless==4.12.0.88", "PySide6==6.8.3"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pyinstaller==6.16.0"]

[project.scripts]
bsae = "bsae.cli:main"
bsae-gui = "bsae.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.dynamic]
version = {attr = "bsae.version.APP_VERSION"}
